<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiphAnon Studios</title>
</head>

<body style="
margin:0;
background:black;
color:white;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
font-family:Arial,sans-serif;
">

<h1>Best Student Education Program</h1>

<div id="screen">

    <button
        id="launch"
        onclick="launch()"
        style="
        display:none;
        padding:10px 25px;
        cursor:pointer;
        "
    >
        LAUNCH
    </button>

</div>

<script>

setTimeout(() => {

    document.getElementById("launch").style.display = "block";

}, 3000);


function launch() {

    const page = window.open("about:blank", "_blank");

    if (!page) {
        alert("Pop-up was blocked.");
        return;
    }

    page.document.open();

    page.document.write(`
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>CiphAnon Studios</title>
        </head>

        <body style="
            margin:0;
            width:100vw;
            height:100vh;
            overflow:hidden;
        ">

            <iframe
                src="home.html"
                style="
                    width:100%;
                    height:100%;
                    border:0;
                "
            ></iframe>

        </body>
        </html>
    `);

    page.document.close();

}

</script>

</body>
</html>
