<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiphAnon Studios</title>
</head>

<body style="
margin:0;
background:#000;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
">

<button onclick="launch()" style="
padding:10px 25px;
cursor:pointer;
">
BUTTON
</button>

<script>

function launch() {

    const page = window.open("about:blank", "_blank");

    if (!page) {
        alert("Please allow pop-ups for this site.");
        return;
    }

    page.document.open();

    page.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>CiphAnon Studios</title>
            <style>
                html, body {
                    margin:0;
                    width:100%;
                    height:100%;
                    overflow:hidden;
                    background:#000;
                }

                iframe {
                    width:100%;
                    height:100%;
                    border:0;
                }
            </style>
        </head>

        <body>
            <iframe src="home.html"></iframe>
        </body>
        </html>
    `);

    page.document.close();
}

</script>

</body>
</html>
