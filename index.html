<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiphAnon Studios</title>
</head>

<body style="margin:0; background:black; color:white; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden;">

<div id="screen">
<h1>Best School Learning Tool</h1>
    <div id="counter">000%</div>

    <button
        id="launch"
        onclick="launch()"
        style="display:none;"
    >
        Ready To Load School Stuff
    </button>

</div>

<script>

let number = 0;

const counter =
    document.getElementById("counter");

const launchButton =
    document.getElementById("launch");


function count() {

    if (number <= 100) {

        counter.textContent =
            String(number).padStart(3, "0") + "%";

        number++;

        setTimeout(count, 35);

    } else {

        launchButton.style.display = "block";

    }

}


function launch() {

    const page = window.open("about:blank", "_blank");

    if (!page) {
        alert("Please allow pop-ups for this site.");
        return;
    }

    page.document.open();

    page.document.write(`
        <!DOCTYPE html>
        <html>
        <head>
            <title>CiphAnon Studios</title>
            <style>
                html, body {
                    margin: 0;
                    width: 100%;
                    height: 100%;
                    overflow: hidden;
                    background: black;
                }

                iframe {
                    width: 100%;
                    height: 100%;
                    border: none;
                }
            </style>
        </head>

        <body>

            <iframe src="home.html"></iframe>

        </body>
        </html>
    `);

    page.document.close();

}


count();

</script>

</body>
</html>
