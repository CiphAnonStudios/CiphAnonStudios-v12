<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CiphAnon Studios</title>
</head>

<body style="margin:0; background:black; color:white; height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden;">

<div id="screen">

    <div id="counter">000%</div>

    <button
        id="launch"
        onclick="launch()"
        style="display:none;"
    >
        LAUNCH
    </button>

</div>

<script>

let number = 0;

const counter =
    document.getElementById("counter");

const launchButton =
    document.getElementById("launch");


function count() {

    if (number <= 100) {

        counter.textContent =
            String(number).padStart(3, "0") + "%";

        number++;

        setTimeout(count, 35);

    } else {

        launchButton.style.display =
            "block";

    }

}


function launch() {

    window.location.href =
        "home.html";

}


count();

</script>

</body>
</html>
